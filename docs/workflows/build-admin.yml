# Prepare SpaceFy Admin for Termux (NO direct build in this workflow).
#
# Purpose: Rafi wants the raw admin source plus already installed Yarn
# packages as a download, so he only has to run it in Termux. This
# workflow therefore does NOT run `yarn build:admin`. It installs
# dependencies once on the runner, packs the source together with
# node_modules into one tarball, and uploads that tarball as an
# artifact. Download the artifact, extract it in Termux, and run it.
#
# What is inside the tarball:
# - apps/admin (the admin dashboard source, including its committed
#   apps/admin/.env, so no secrets need to be set for a local run)
# - libs (shared code the admin app imports)
# - node_modules (Yarn packages already installed on the runner)
# - package.json, yarn.lock, nx.json, tsconfig.base.json,
#   jest.config.ts, jest.preset.js, .npmrc (workspace files Nx needs)
# - TERMUX_README.txt (how to run it in Termux)
#
# What is NOT inside: no built dist output, no .git history.
#
# Run it manually only (Actions, Prepare SpaceFy Admin for Termux,
# Run workflow). It does not run on every push, because the tarball
# is large and is only needed when Rafi wants a fresh download.
# The artifact is kept for 14 days, then it expires and the workflow
# has to be run again for a fresh download.
#
# Platform caveat, read this before running in Termux: node_modules
# in this package was installed on an ubuntu x86_64 runner, so its
# native binaries (for example Nx and esbuild) are built for that
# platform. Termux on a phone is Android arm64 with a different
# libc, so if Termux reports a native binary error, run
# `yarn install` once inside the extracted folder in Termux. That
# only replaces the platform binaries, the source is already there.
# If it runs without that error, do not run yarn install again.

name: Prepare SpaceFy Admin for Termux

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
          cache: 'yarn'

      - name: Install Yarn packages
        run: yarn install --frozen-lockfile

      - name: Write Termux guide
        run: |
          cat > TERMUX_README.txt <<'TERMUX_EOF'
          SPACEFY ADMIN UNTUK TERMUX
          ==========================
          Paket ini berisi mentahan admin dashboard SpaceFy
          (apps/admin) beserta libs yang dipakainya dan node_modules
          yang sudah terinstall. Kamu tidak perlu build di GitHub
          Actions, cukup jalankan di Termux.

          LANGKAH DI TERMUX
          ------------------
          1. Siapkan folder kosong, lalu ekstrak paket ini di dalamnya:
             mkdir -p spacefy-admin
             cd spacefy-admin
             tar -xzf spacefy-admin-termux.tar.gz

          2. Pastikan Node.js dan Yarn terpasang di Termux:
             pkg update
             pkg install nodejs yarn
             Kalau yarn tidak ada di pkg, pakai:
             npm install -g yarn

          3. Jalankan admin dashboard (tanpa yarn install dulu):
             yarn dev:admin

          4. Buka di browser HP:
             http://127.0.0.1:4200/

          CATATAN
          -------
          - File apps/admin/.env sudah ikut di dalam paket, jadi
            tidak perlu isi secret apa pun untuk jalan lokal.
          - Jangan jalankan yarn install dulu. Jalankan hanya kalau
            Termux mengeluh soal binary native (misalnya nx atau
            esbuild tidak bisa jalan), karena node_modules di paket
            ini dibuat di runner ubuntu x86_64, sedangkan HP
            Android arm64. Sekali yarn install di Termux cukup
            untuk mengganti binary platform itu.
          - Jangan commit node_modules ke repo.
          TERMUX_EOF

      - name: Create Termux package
        run: |
          tar --exclude='node_modules/.cache' --exclude='dist' --exclude='coverage' -czf spacefy-admin-termux.tar.gz apps/admin libs node_modules package.json yarn.lock nx.json tsconfig.base.json jest.config.ts jest.preset.js .npmrc TERMUX_README.txt
          ls -lh spacefy-admin-termux.tar.gz
          du -sh spacefy-admin-termux.tar.gz

      - name: Upload Termux package
        uses: actions/upload-artifact@v4
        with:
          name: spacefy-admin-termux
          path: spacefy-admin-termux.tar.gz
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
